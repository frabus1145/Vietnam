body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f4ef;color:#1d2a26}

.it b{flex:1}.it small{color:#6b7770}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px #0003;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s;z-index:2000}
#sheet.open{transform:none}
#sheet a{display:inline-block;margin:8px 8px 0 0;background:#1f7a5c;color:#fff;padding:9px 13px;border-radius:10px;text-decoration:none;font-size:14px}
#sheet .x{float:right;border:0;background:none;font-size:20px}
.pin{background:#1f7a5c;color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;font-weight:600;border:2px solid #fff}
.leg{margin:4px 0 0 18px;color:#6b7770;font-size:13px}
details{margin-top:14px}summary{font-weight:600;padding:6px 2px}
.it a{color:#1f7a5c;font-size:13px;text-decoration:none;border:1px solid #1f7a5c;border-radius:8px;padding:4px 8px}
#sheet{max-height:60vh;overflow:auto;overscroll-behavior:contain;will-change:transform;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#days{scroll-behavior:smooth;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}#days button{scroll-snap-align:center;transition:background .2s,color .2s}
.it,.leg{animation:in .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.pin{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tk{background:#eef6f2;border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.5;font-size:14px}
.chips{display:flex;gap:8px;margin-top:10px}
.chips button,.pill{border:1px solid #1f7a5c;background:#fff;color:#1f7a5c;border-radius:20px;padding:7px 12px;font-size:14px}
.fx{display:flex;gap:10px;margin:10px 0}.fx label{flex:1;font-size:13px;color:#6b7770}
.fx input{width:100%;margin-top:4px;padding:10px;border:1px solid #d6d1c4;border-radius:10px;font-size:18px;background:#fff;color:#1d2a26}
.rst{width:28px;height:28px;line-height:26px;text-align:center;font-size:16px;background:#fff;border:1px solid #d6d1c4;border-radius:50%;box-shadow:0 1px 4px #0003;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}

const gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const lab=d=>new Date(d+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const dir=(a,b,m)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode='+(/piedi/.test(m)?'walking':'driving');
const photo=q=>'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q);
function items(day){
  return day.s.map(x=>{
    if(x.h){const k=H[x.h];return {n:k.n,c:k.c,x:x.x?x.x+' · '+k.a:k.a,k:'🏨',q:k.a,b:k.b,m:x.m,t:x.t}}
    return {...x,k:'📍',q:x.q||x.n+(day.cy?', '+day.cy:'')};
  });
}
let cur=-1,first=true;
const CK='vn-legs-v1';let LC={};try{LC=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}
const key=(a,b)=>a.c.join(',')+'>'+b.c.join(',');
const road=it=>it.p&&it.m&&!it.nr&&!/volo|treno|navigazione/i.test(it.m);
const fm=s=>s>=3600?Math.floor(s/3600)+'h'+String(Math.round(s%3600/60)).padStart(2,'0'):Math.round(s/60)+' min';
function real(it,l){const w=/piedi/.test(it.m),m=w?l.d/1000/4.8*3600:l.s,hi=w?m:m*(l.d<25000?1.4:1.2);
  return (w?'A piedi ':'')+'circa '+(hi>m*1.05?fm(m).replace(' min','')+'–'+fm(hi):fm(m))+' · '+(l.d/1000).toFixed(1).replace('.',',')+' km'}
async function leg(a,b){
  const k=key(a,b);if(LC[k])return LC[k];
  await new Promise(r=>setTimeout(r,200));
  const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+a.c[1]+','+a.c[0]+';'+b.c[1]+','+b.c[0]+'?overview=full&geometries=geojson');
  const j=await r.json();if(j.code!=='Ok')throw 0;
  const o=j.routes[0],c=o.geometry.coordinates,st=Math.ceil(c.length/80);
  LC[k]={s:Math.round(o.duration),d:Math.round(o.distance),g:c.filter((_,i)=>i%st==0||i==c.length-1).map(p=>[p[1],p[0]])};
  try{localStorage.setItem(CK,JSON.stringify(LC))}catch(e){}
  return LC[k];
}
async function enrich(a,i){
  for(const it of a){
    if(cur!==i)return;
    if(!road(it))continue;
    try{const l=await leg(it.p,it);if(cur!==i)return;
      it.rm=real(it,l);if(it.g)it.g.textContent='↓ ✓ '+it.rm;
      if(it.pl)layer.removeLayer(it.pl);
      it.pl=L.polyline(l.g,{color:'#1f7a5c',weight:4}).addTo(layer)}catch(e){}
  }
}
async function warm(){for(let i=0;i<D.length;i++){const a=items(D[i]);for(let j=1;j<a.length;j++){a[j].p=a[j-1];if(road(a[j]))try{await leg(a[j-1],a[j])}catch(e){}}}}
const rl=L.layerGroup().addTo(map);
const WC=c=>c==0?'Sereno':c<=2?'Poco nuvoloso':c==3?'Coperto':c<=48?'Nebbia':c<=57?'Pioviggine':c<=67?'Pioggia':c<=77?'Neve':c<=82?'Rovesci':'Temporale';
function sheet(html){const s=$('sheet');s.innerHTML='<button class="x" onclick="this.parentNode.classList.remove(\'open\')">✕</button>'+html;s.classList.add('open')}
async function wx(la,lo){const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=16');return r.json()}
function weatherSheet(day){
  const k=CITY[day.cy],w=W[k];
  sheet('<h3 style="margin:0">☀️ Meteo · '+w.n+'</h3><p><b>Di solito tra fine dicembre e gennaio:</b> '+w.t+'<br>'+w.s+'</p><b>Cosa mettere in valigia</b><ul style="margin:6px 0">'+w.a.map(x=>'<li>'+x+'</li>').join('')+'</ul><div id="wf" class="tk">Previsione per questo giorno: controllo…</div><button id="wl" class="pill">📍 Meteo dove sei ora</button><div id="wn" class="tk" style="display:none"></div><small style="color:#6b7770">Valori climatici indicativi, non previsioni.</small>');
  wx(CC[k][0],CC[k][1]).then(j=>{const i=j.daily.time.indexOf(day.d);
    $('wf').innerHTML=i<0?'Previsione per questo giorno: disponibile solo nei 16 giorni prima della data.':'Previsione per questo giorno: <b>'+Math.round(j.daily.temperature_2m_min[i])+'–'+Math.round(j.daily.temperature_2m_max[i])+' °C</b> · '+WC(j.daily.weather_code[i])+' · pioggia '+j.daily.precipitation_probability_max[i]+'%'}).catch(()=>{$('wf').textContent='Previsione per questo giorno: serve la connessione a internet.'});
  $('wl').onclick=()=>{const n=$('wn');n.style.display='block';n.textContent='Cerco la tua posizione…';
    if(!navigator.geolocation){n.textContent='Posizione non disponibile su questo dispositivo.';return}
    navigator.geolocation.getCurrentPosition(p=>wx(p.coords.latitude,p.coords.longitude).then(j=>{const c=j.current;
      n.innerHTML='<b>Adesso: '+Math.round(c.temperature_2m)+' °C</b> (percepita '+Math.round(c.apparent_temperature)+' °C) · '+WC(c.weather_code)+' · vento '+Math.round(c.wind_speed_10m)+' km/h<br>Oggi: '+Math.round(j.daily.temperature_2m_min[0])+'–'+Math.round(j.daily.temperature_2m_max[0])+' °C · pioggia '+j.daily.precipitation_probability_max[0]+'%'}).catch(()=>{n.textContent='Serve la connessione a internet.'}),()=>{n.textContent='Posizione non autorizzata: consenti l\'accesso alla posizione per questo sito.'},{timeout:10000})}
}
let FX={r:29500,t:0};try{FX=JSON.parse(localStorage.getItem('vn-fx'))||FX}catch(e){}
async function fxLoad(){try{const j=await(await fetch('https://open.er-api.com/v6/latest/EUR')).json();if(j.rates&&j.rates.VND){FX={r:j.rates.VND,t:Date.now()};try{localStorage.setItem('vn-fx',JSON.stringify(FX))}catch(e){}}}catch(e){}}
function fxSheet(){
  sheet('<h3 style="margin:0">💱 Convertitore euro ↔ dong</h3><div class="fx"><label>Euro<input id="fe" type="number" inputmode="decimal" placeholder="€"></label><label>Dong<input id="fv" type="number" inputmode="numeric" placeholder="₫"></label></div><div id="fr" class="tk"></div>');
  const info=()=>{$('fr').innerHTML='1 € = '+Math.round(FX.r).toLocaleString('it-IT')+' ₫<br><small>'+(FX.t?'Tasso aggiornato il '+new Date(FX.t).toLocaleDateString('it-IT'):'Tasso di riserva (stima): collegati a internet per aggiornarlo')+'</small>'};
  info();
  $('fe').oninput=()=>{$('fv').value=$('fe').value?Math.round($('fe').value*FX.r):''};
  $('fv').oninput=()=>{$('fe').value=$('fv').value?($('fv').value/FX.r).toFixed(2):''};
  fxLoad().then(()=>{info();if($('fe').value)$('fe').oninput()});
}
document.addEventListener('click',e=>{if(!$('sheet').contains(e.target))$('sheet').classList.remove('open')},true);
function show(i){
  const day=D[i],a=items(day);
  [...$('days').children].forEach((b,j)=>{b.classList.toggle('on',j==i);if(j==i)b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})});
  $('sheet').classList.remove('open');
  layer.clearLayers();rl.clearLayers();
  a.forEach((it,j)=>{it.p=a[j-1];L.marker(it.c,{icon:L.divIcon({className:'',html:'<div class="pin">'+(j+1)+'</div>',iconSize:[26,26]})}).on('click',()=>card(it)).addTo(layer)});
  cur=i;a.forEach((it,j)=>{if(j)it.pl=L.polyline([a[j-1].c,it.c],{color:'#1f7a5c',weight:3,dashArray:'6 6'}).addTo(layer)});
  a.forEach(it=>{if(it.rt){it.pl&&layer.removeLayer(it.pl);it.pl=L.polyline([it.p.c,...it.rt.map(r=>[r[0],r[1]]),it.c],{color:'#c2410c',weight:4}).addTo(layer);it.rt.forEach(r=>{if(r[2])L.circleMarker([r[0],r[1]],{radius:5,color:'#c2410c',fillColor:'#fff',fillOpacity:1,weight:2}).bindTooltip(r[2]).addTo(layer)})}});
  const pts=a.flatMap(x=>[x.c,...(x.rt||[]).map(r=>[r[0],r[1]])]);
  if(first){map.fitBounds(pts,{padding:[40,40],maxZoom:13,animate:false});first=false}else map.flyToBounds(pts,{padding:[40,40],maxZoom:13,duration:1.1});
  $('info').innerHTML='<h2>'+lab(day.d)+' · '+day.t+'</h2><small style="color:#6b7770">✓ = durata calcolata sul percorso stradale (la seconda cifra include il traffico). Le altre sono stime: tocca una tappa → Indicazioni per i tempi aggiornati.</small><div class="chips">'+(CITY[day.cy]?'<button id="bw">☀️ Meteo</button>':'')+'<button id="bf">💱 Valuta</button></div>';
  if($('bw'))$('bw').onclick=()=>weatherSheet(day);$('bf').onclick=fxSheet;
  const ls=$('list');ls.innerHTML='';
  a.forEach((it,ix)=>{
    if(it.p&&it.m){const g=document.createElement('div');g.className='leg';g.textContent='↓ '+it.m;it.g=g;ls.appendChild(g)}
    const e=document.createElement('div');e.className='it';e.style.animationDelay=Math.min(ix*30,300)+'ms';
    e.innerHTML='<span>'+it.k+'</span><b>'+it.n+'</b><small>'+(it.t||'')+'</small>';
    e.onclick=()=>{card(it);map.flyTo(it.c,14,{duration:.8})};ls.appendChild(e)});
  const rk=R[CITY[day.cy]];
  if(rk){const d=document.createElement('details');
    d.innerHTML='<summary>🍜 Dove mangiare a '+rk.n+'</summary>'+rk.l.map(x=>'<div class="it"><div style="flex:1"><b>'+x[0]+'</b><br><small>'+x[1]+'</small></div><a href="'+gm(x[0]+', '+rk.n)+'" target="_blank" rel="noopener">Mappa</a></div>').join('')+'<p style="color:#6b7770;font-size:13px">Sulla mappa le 🍜 sono posizioni approssimative e non fanno parte del percorso: per il punto esatto usa il pulsante Mappa.</p>';
    d.addEventListener('toggle',()=>{rl.clearLayers();if(d.open)rk.l.forEach(x=>{if(x[2])L.marker(x[2],{icon:L.divIcon({className:'',html:'<div class="rst">🍜</div>',iconSize:[28,28]})}).on('click',()=>card({n:x[0],k:'🍜',x:x[1],q:x[0]+', '+rk.n,c:x[2]})).addTo(rl)})});
    ls.appendChild(d)}
  const s=S[day.sg];
  if(s){const d=document.createElement('details');d.open=a.filter(x=>x.k=='📍').length<2;
    d.innerHTML='<summary>💡 Suggerimenti a '+s.n+'</summary>'+s.l.map(x=>'<div class="it"><div style="flex:1"><b>'+x[0]+'</b><br><small>'+x[1]+'</small></div><a href="'+photo(x[0]+' '+s.n)+'" target="_blank" rel="noopener">Foto</a><a href="'+gm(x[0]+', '+s.n)+'" target="_blank" rel="noopener">Mappa</a></div>').join('');
    ls.appendChild(d)}
  enrich(a,i);
}
function card(it){
  const lk=(u,t)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';
  $('sheet').innerHTML='<button class="x" onclick="this.parentNode.classList.remove(\'open\')">✕</button><h3 style="margin:0">'+it.k+' '+it.n+'</h3>'+(it.t?'<p><b>Orario:</b> '+it.t+'</p>':'')+(it.p&&it.m?'<p><b>Spostamento da '+it.p.n+':</b> '+(it.rm?it.rm+' (calcolato sul percorso stradale)':it.m)+'</p>':'')+(it.x?'<p>'+it.x+'</p>':'')+(it.tk?'<div class="tk">'+it.tk.join('<br>')+'</div>':'')+lk(gm(it.q),'Apri su Google Maps')+(it.p&&it.m&&!/volo|treno/i.test(it.m)?lk(dir(it.p.q,it.q,it.m),'Indicazioni'):'')+(it.b?lk(it.b,'Apri su Booking'):'');
  $('sheet').classList.add('open');
}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=lab(d.d);b.onclick=()=>show(i);$('days').appendChild(b)});
const t=new Date().toISOString().slice(0,10),s=D.findIndex(d=>d.d===t);
show(s<0?0:s);
setTimeout(()=>map.invalidateSize(),200);
warm();fxLoad();
(()=>{let y=0;const s=$('sheet');
s.addEventListener('touchstart',e=>{y=e.touches[0].clientY;s.style.transition='none'},{passive:true});
s.addEventListener('touchmove',e=>{const d=e.touches[0].clientY-y;if(d>0&&s.scrollTop<=0)s.style.transform='translateY('+d+'px)'},{passive:true});
s.addEventListener('touchend',e=>{s.style.transition='';s.style.transform='';if(e.changedTouches[0].clientY-y>80&&s.scrollTop<=0)s.classList.remove('open')});})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
