.it,.leg{animation:in .3s cubic-bezier(.2,.8,.2,1) both}

.pin{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}

  $('info').innerHTML='<h2>'+lab(day.d)+' · '+day.t+'</h2><div id="nx" class="nx" style="display:none"></div><small style="color:#6b7770">✓ = durata calcolata sul percorso stradale (la seconda cifra include il traffico). Le altre sono stime: tocca una tappa → Indicazioni per i tempi aggiornati.</small><div class="chips">'+(CITY[day.cy]?'<button id="bw">☀️ Meteo</button>':'')+(R[CITY[day.cy]]?'<button id="br">🍜 Ristoranti</button>':'')+'<button id="bf">💱 Valuta</button>'+(CITY[day.cy]?'<button id="bs">🆘 SOS</button>':'')+'</div>';
  if($('bw'))$('bw').onclick=()=>weatherSheet(day);if($('br'))$('br').onclick=()=>restSheet(day);$('bf').onclick=fxSheet;if($('bs'))$('bs').onclick=()=>sosSheet(day);nxItems=a;updNx();
  const ls=$('list');ls.innerHTML='';
  a.forEach((it,ix)=>{
    if(it.p&&it.m){const g=document.createElement('div');g.className='leg';g.textContent='↓ '+it.m;it.g=g;ls.appendChild(g)}
    const e=document.createElement('div');e.className='it';e.style.animationDelay=Math.min(ix*30,300)+'ms';
    e.innerHTML='<span>'+it.k+'</span><b>'+it.n+(it.lk?' 🎟️':'')+'</b><small>'+(it.t||'')+'</small>';
    e.onclick=()=>{card(it);map.flyTo(it.c,14,{duration:.8})};ls.appendChild(e)});
  const s=S[day.sg];
  if(s){const d=document.createElement('details');d.open=a.filter(x=>x.k=='📍').length<2;
    d.innerHTML='<summary>💡 Suggerimenti a '+s.n+'</summary>'+s.l.map(x=>'<div class="it"><div style="flex:1"><b>'+x[0]+'</b><br><small>'+x[1]+'</small></div><a href="'+photo(x[0]+' '+s.n)+'" target="_blank" rel="noopener">Foto</a><a href="'+gm(x[0]+', '+s.n)+'" target="_blank" rel="noopener">Mappa</a></div>').join('');
    ls.appendChild(d)}
  enrich(a,i);
}
function card(it){
  const lk=(u,t)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';
  $('sheet').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3 style="margin:0">'+it.k+' '+it.n+'</h3>'+(it.t?'<p><b>Orario:</b> '+it.t+'</p>':'')+(it.p&&it.m?'<p><b>Spostamento da '+it.p.n+':</b> '+(it.rm?it.rm+' (calcolato sul percorso stradale)':it.m)+'</p>':'')+(it.x?'<p>'+it.x+'</p>':'')+(it.tk?'<div class="tk">'+it.tk.join('<br>')+'</div>':'')+lk(gm(it.q),'Apri su Google Maps')+(it.p&&it.m&&!/volo|treno/i.test(it.m)?lk(dir(it.p.q,it.q,it.m),'Indicazioni'):'')+(it.b?lk(it.b,'Apri su Booking'):'')+(it.lk?lk(it.lk[1],'🎟️ '+it.lk[0]):'')+(it.dst?lk(dirTo(it.dst),'🧭 Indicazioni da dove sei'):'');
  $('sheet').classList.add('open');
}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=lab(d.d);b.onclick=()=>show(i);$('days').appendChild(b)});
const t=todayIso(),s=D.findIndex(d=>d.d===t);
show(s<0?0:s);

warm();fxLoad();setInterval(updNx,30000);
(()=>{let y=0;const s=$('sheet');
s.addEventListener('touchstart',e=>{y=e.touches[0].clientY;s.style.transition='none'},{passive:true});
s.addEventListener('touchmove',e=>{const d=e.touches[0].clientY-y;if(d>0&&s.scrollTop<=0)s.style.transform='translateY('+d+'px)'},{passive:true});
s.addEventListener('touchend',e=>{s.style.transition='';s.style.transform='';if(e.changedTouches[0].clientY-y>80&&s.scrollTop<=0)closeSheet()});})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
