<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f4ef;color:#1d2a26}
#days{display:flex;gap:8px;overflow-x:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#fff;border-bottom:1px solid #e3dfd5;position:sticky;top:0;z-index:1000}
#days button{flex:none;border:1px solid #d6d1c4;background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;color:#1d2a26}
#days button.on{background:#1f7a5c;border-color:#1f7a5c;color:#fff}
#map{height:40vh;width:100%}
#info{padding:12px 14px 4px}
#info h2{margin:0;font-size:18px}
#list{padding:0 12px 24px}
.it{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #e3dfd5;border-radius:12px;padding:12px;margin-top:8px}
.it b{flex:1}.it small{color:#6b7770}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px #0003;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s;z-index:2000}
#sheet.open{transform:none}
#sheet a{display:inline-block;margin:8px 8px 0 0;background:#1f7a5c;color:#fff;padding:9px 13px;border-radius:10px;text-decoration:none;font-size:14px}
#sheet .x{float:right;border:0;background:none;font-size:20px}
.pin{background:#1f7a5c;color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;font-weight:600;border:2px solid #fff}
.leg{margin:4px 0 0 18px;color:#6b7770;font-size:13px}
details{margin-top:14px}summary{font-weight:600;padding:6px 2px}
.it a{color:#1f7a5c;font-size:13px;text-decoration:none;border:1px solid #1f7a5c;border-radius:8px;padding:4px 8px}
</style>
</head>

const S={
hcm:{n:"Ho Chi Minh",l:[["Museo dei Residuati Bellici","Il museo più visitato della città, sulla guerra: duro ma importante"],["Palazzo dell'Indipendenza","Ex sede del governo del Sud, con bunker e sale originali"],["Pagoda dell'Imperatore di Giada","Tempio taoista pieno di incenso e statue"],["Cholon e Mercato Binh Tay","La Chinatown di Saigon, con mercato e templi cinesi"],["Bitexco Financial Tower","Terrazza panoramica sulla città, bella al tramonto"]]},
hoian:{n:"Hoi An",l:[["Biglietto cumulativo della città vecchia","Ticket di 3 giorni (circa 3 €) per templi e case storiche"],["Spiaggia di An Bang","A circa 5 km dal centro, relax e locali sul mare"],["Villaggio di Tra Que","Giro in bici tra gli orti e lezione di cucina"],["Santuario di My Son","Rovine Unesco del regno Champa, a circa 40 km (mezza giornata)"],["White Rose e Cao Lau","Piatti tipici di Hoi An: ravioli di riso ai gamberi e noodles"]]},
nb:{n:"Ninh Binh",l:[["Hoa Lu, antica capitale","Templi dei re Dinh e Le, vicino alla zona dell'hotel"],["Pagoda di Bai Dinh","Il complesso buddista più grande del Vietnam"],["Giro in barca a Tam Coc","Alternativa a Trang An, tra risaie e grotte"],["Riserva di Van Long","Zona umida da esplorare in barca, con possibili avvistamenti di langur"],["Parco nazionale di Cuc Phuong","Foresta pluviale, escursione di una giornata"]]},
hn:{n:"Hanoi",l:[["Prigione di Hoa Lo","Museo nell'ex prigione coloniale"],["Bun cha e pho nel Quartiere Vecchio","Street food tipico di Hanoi"],["Ponte Long Bien","Ponte in ferro di epoca francese, bello al tramonto"],["Mercato notturno del weekend","Venerdì, sabato e domenica sera nel Quartiere Vecchio (il 9 gennaio è sabato)"],["Museo di Etnologia","Le culture delle 54 etnie del Vietnam"]]}
};
const $=i=>document.getElementById(i);
const map=L.map('map').setView([16,106],5);
const MAPTILER_KEY=""; // incolla qui la chiave MapTiler, tra le virgolette
const tiles=MAPTILER_KEY?'https://api.maptiler.com/maps/streets-v2/256/{z}/{x}/{y}.png?key='+MAPTILER_KEY:'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
L.tileLayer(tiles,{maxZoom:19,crossOrigin:true,attribution:MAPTILER_KEY?'© MapTiler © OpenStreetMap contributors':'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);
const gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const lab=d=>new Date(d+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const dir=(a,b,m)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode='+(/piedi/.test(m)?'walking':'driving');
const photo=q=>'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q);
function items(day){
  return day.s.map(x=>{
    if(x.h){const k=H[x.h];return {n:k.n,c:k.c,x:k.a,k:'🏨',q:k.a,b:k.b,m:x.m,t:x.t}}
    return {...x,k:'📍',q:x.q||x.n+(day.cy?', '+day.cy:'')};
  });
}
function show(i){
  const day=D[i],a=items(day);
  [...$('days').children].forEach((b,j)=>b.classList.toggle('on',j==i));
  $('sheet').classList.remove('open');
  layer.clearLayers();
  a.forEach((it,j)=>{it.p=a[j-1];L.marker(it.c,{icon:L.divIcon({className:'',html:'<div class="pin">'+(j+1)+'</div>',iconSize:[26,26]})}).on('click',()=>card(it)).addTo(layer)});
  if(a.length>1)L.polyline(a.map(x=>x.c),{color:'#1f7a5c',weight:3,dashArray:'6 6'}).addTo(layer);
  map.fitBounds(a.map(x=>x.c),{padding:[40,40],maxZoom:13});
  $('info').innerHTML='<h2>'+lab(day.d)+' · '+day.t+'</h2><small style="color:#6b7770">Durate indicative: tocca una tappa → Indicazioni per il tempo aggiornato su Google Maps.</small>';
  const ls=$('list');ls.innerHTML='';
  a.forEach(it=>{
    if(it.p&&it.m){const g=document.createElement('div');g.className='leg';g.textContent='↓ '+it.m;ls.appendChild(g)}
    const e=document.createElement('div');e.className='it';
    e.innerHTML='<span>'+it.k+'</span><b>'+it.n+'</b><small>'+(it.t||'')+'</small>';
    e.onclick=()=>{card(it);map.setView(it.c,13)};ls.appendChild(e)});
  const s=S[day.sg];
  if(s){const d=document.createElement('details');d.open=a.filter(x=>x.k=='📍').length<2;
    d.innerHTML='<summary>💡 Suggerimenti a '+s.n+'</summary>'+s.l.map(x=>'<div class="it"><div style="flex:1"><b>'+x[0]+'</b><br><small>'+x[1]+'</small></div><a href="'+photo(x[0]+' '+s.n)+'" target="_blank" rel="noopener">Foto</a><a href="'+gm(x[0]+', '+s.n)+'" target="_blank" rel="noopener">Mappa</a></div>').join('');
    ls.appendChild(d)}
}
function card(it){
  const lk=(u,t)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';
  $('sheet').innerHTML='<button class="x" onclick="this.parentNode.classList.remove(\'open\')">✕</button><h3 style="margin:0">'+it.k+' '+it.n+'</h3>'+(it.t?'<p><b>Orario:</b> '+it.t+'</p>':'')+(it.p&&it.m?'<p><b>Spostamento da '+it.p.n+':</b> '+it.m+'</p>':'')+(it.x?'<p>'+it.x+'</p>':'')+lk(gm(it.q),'Apri su Google Maps')+(it.p&&it.m&&!/volo|treno/i.test(it.m)?lk(dir(it.p.q,it.q,it.m),'Indicazioni'):'')+(it.b?lk(it.b,'Apri su Booking'):'');
  $('sheet').classList.add('open');
}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=lab(d.d);b.onclick=()=>show(i);$('days').appendChild(b)});
const t=new Date().toISOString().slice(0,10),s=D.findIndex(d=>d.d===t);
show(s<0?0:s);
setTimeout(()=>map.invalidateSize(),200);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

</html>
